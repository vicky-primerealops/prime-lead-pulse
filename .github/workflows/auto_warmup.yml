name: Auto Email Warmup

on:
  workflow_dispatch:

jobs:
  warmup:
    runs-on: ubuntu-latest
    timeout-minutes: 180 # 3 hours because it pauses heavily to mimic humans

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Write warmup CSV
        run: echo '${{ secrets.WARMUP_CSV }}' > Email_Warmup_Project/warmup_accounts.csv

      - name: Run Auto Warmup Script
        run: |
          cd Email_Warmup_Project
          python auto_warmup.py
