name: Auto Reply to Friends

on:
  schedule:
    # Runs every 4 hours automatically
    - cron: "0 */4 * * *"
  workflow_dispatch:

jobs:
  reply:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Load Accounts CSV
        run: echo '${{ secrets.WARMUP_CSV }}' > Email_Warmup_Project/warmup_accounts.csv

      - name: Run Auto Reply Script
        run: |
          cd Email_Warmup_Project
          python scan_and_reply.py
