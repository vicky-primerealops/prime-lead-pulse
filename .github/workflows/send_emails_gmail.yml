name: Send Daily Outreach (Gmail)

on:
  workflow_dispatch:

jobs:
  send-emails-gmail:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    defaults:
      run:
        working-directory: Email_Warmup_Project

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write service_account.json
        run: echo '${{ secrets.SERVICE_ACCOUNT_JSON }}' > service_account.json

      - name: Create config.py from Gmail cloud template
        run: cp cloud_config_gmail.py config.py

      - name: Run email sender
        env:
          SPREADSHEET_ID:     ${{ secrets.SPREADSHEET_ID }}
          GMAIL_USER:         ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          FROM_NAME:          "Vicky Thakkar"
        run: python send_emails.py --auto
