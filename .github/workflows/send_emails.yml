name: Send Daily Outreach Emails

on:
  schedule:
    - cron: "0 12 * * *"   # 12:00 UTC = 5:30 PM IST
  workflow_dispatch:

jobs:
  send-emails:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write service_account.json
        run: echo '${{ secrets.SERVICE_ACCOUNT_JSON }}' > service_account.json

      - name: Create config.py from cloud template
        run: cp cloud_config.py config.py

      - name: Run email sender
        env:
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          SMTP_HOST:      ${{ secrets.SMTP_HOST }}
          SMTP_PORT:      ${{ secrets.SMTP_PORT }}
          SMTP_USER:      ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD:  ${{ secrets.SMTP_PASSWORD }}
          FROM_NAME:      ${{ secrets.FROM_NAME }}
        run: python send_emails.py --auto
