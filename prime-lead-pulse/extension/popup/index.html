<!DOCTYPE html>
<html>
  <head>
    <title>Prime Lead Pulse</title>
    <style>
      body { width: 300px; padding: 15px; font-family: sans-serif; }
      input { width: 100%; padding: 8px; margin: 8px 0; box-sizing: border-box; }
      button { width: 100%; padding: 10px; background: #4f46e5; color: white; border: none; border-radius: 4px; cursor: pointer; }
      button:hover { background: #4338ca; }
      .hidden { display: none; }
      #errorMsg { color: red; font-size: 12px; }
      #statusMsg { color: green; font-size: 12px; }
    </style>
  </head>
  <body>
    <h3>Prime Lead Pulse</h3>

    <div id="loginSection">
      <p>Log in to link your Gmail tracker.</p>
      <input type="text" id="apiUrl" placeholder="API URL (e.g. http://localhost:3000)" />
      <input type="email" id="email" placeholder="Email" />
      <input type="password" id="password" placeholder="Password" />
      <button id="loginBtn">Log In</button>
      <p id="errorMsg"></p>
    </div>

    <div id="loggedInSection" class="hidden">
      <p id="statusMsg">Logged in successfully! Tracking is active.</p>
      <button id="logoutBtn" style="background: #ef4444;">Log Out</button>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
